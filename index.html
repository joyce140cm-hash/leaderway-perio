<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="立威牙周">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F7F7">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>立威牙周檢查</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7F7;--surface:#FFFFFF;--ink:#14232A;--muted:#5E6E75;--line:#D6DFE1;--line-strong:#AFC0C4;
  --accent:#0D6B70;--accent-ink:#FFFFFF;--accent-soft:#E0EFEF;
  --ok:#2C8A5E;--ok-bg:#E2F2E9;--warn:#A86C12;--warn-bg:#FBEFD6;--deep:#BF3329;--deep-bg:#FBE1DE;
  --pl:#3A5FC4;--hatch:#E9EEEF;
  --num:"IBM Plex Sans","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --txt:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --cw:clamp(22px,calc((100vw - 92px)/48),30px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E181B;--surface:#162428;--ink:#E5EEF0;--muted:#94A6AC;--line:#28393E;--line-strong:#41565C;
  --accent:#4DB2B4;--accent-ink:#0E181B;--accent-soft:#183336;
  --ok:#5CC48E;--ok-bg:#16301F;--warn:#E2AE4A;--warn-bg:#33290F;--deep:#EF7469;--deep-bg:#3A1C19;--pl:#86A2F2;--hatch:#1C2C30;}}
:root[data-theme="dark"]{
  --bg:#0E181B;--surface:#162428;--ink:#E5EEF0;--muted:#94A6AC;--line:#28393E;--line-strong:#41565C;
  --accent:#4DB2B4;--accent-ink:#0E181B;--accent-soft:#183336;
  --ok:#5CC48E;--ok-bg:#16301F;--warn:#E2AE4A;--warn-bg:#33290F;--deep:#EF7469;--deep-bg:#3A1C19;--pl:#86A2F2;--hatch:#1C2C30;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--txt);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.bar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em;flex:1;min-width:0}
.bar h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:40px;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--deep);border-color:var(--deep)}
.btn:disabled{opacity:.45;cursor:default}

/* home */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin:14px 0 6px}
.daygroup h2{font-size:13px;color:var(--muted);font-weight:500;margin:18px 0 6px}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.rec .code{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums;font-size:16px}
.rec .who{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .meta{grid-column:2/3;font-size:13px;color:var(--muted)}
.rec .bop{grid-row:1/3;grid-column:3;text-align:right;font-family:var(--num);font-size:13px;color:var(--muted)}
.rec .bop b{display:block;font-size:17px;color:var(--ink)}
.empty{padding:48px 8px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:14px}

/* editor */
.stats{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.stat{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:92px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-family:var(--num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.modes{display:flex;gap:4px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.mode{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:2px 0 8px}

.chartbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;-webkit-overflow-scrolling:touch}
.arch{display:grid;grid-template-columns:52px repeat(48,var(--cw));width:max-content}
.arch+.arch{margin-top:14px;padding-top:14px;border-top:2px dashed var(--line)}
.lab{font-size:12px;color:var(--muted);display:flex;align-items:center;padding-right:6px;position:sticky;left:-8px;background:var(--surface);z-index:2;line-height:1.15}
.c{height:34px;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;padding:0;font-family:var(--num);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;position:relative}
.c.t0{border-left:1px solid var(--line-strong)}
.c.mid{border-left:3px solid var(--ink)}
.c.ok{background:var(--ok-bg);color:var(--ok)}
.c.warn{background:var(--warn-bg);color:var(--warn)}
.c.deep{background:var(--deep-bg);color:var(--deep);font-weight:600}
.c.miss{background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,transparent 4px 8px);cursor:default}
.c.cur{box-shadow:inset 0 0 0 2.5px var(--accent);z-index:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--deep)}
.dot.pl{background:var(--pl)}
.dot.no{width:5px;height:5px;background:var(--line-strong)}
.tn{grid-column:span 3;height:42px;border:0;border-left:1px solid var(--line-strong);background:transparent;font-family:var(--num);font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0}
.tn.mid{border-left:3px solid var(--ink)}
.tn.miss>b{text-decoration:line-through;color:var(--muted)}
.tn.sel{background:var(--accent-soft)}
.tn i{font-style:normal;font-size:10px;font-weight:500;color:var(--accent);min-height:11px}

.dist{margin:14px 0 6px}
.dist .track{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.dist .track span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.pad{position:sticky;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);margin-top:14px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.padhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:14px}
.padhead b{font-family:var(--num);font-size:16px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:560px}
.key{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:48px;font-family:var(--num);font-size:20px;font-weight:500}
.key:active{background:var(--accent-soft)}
.key.yes{color:var(--deep);font-size:18px}
.key.plyes{color:var(--pl);font-size:18px}
.key.wide{grid-column:span 2;font-size:16px;font-family:var(--txt)}
.navrow{display:flex;gap:6px;margin-top:6px;max-width:560px}
.navrow .btn{flex:1;min-height:44px}

.toothpanel{display:grid;gap:12px;max-width:640px}
.fieldrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fieldrow>span{width:72px;font-size:14px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;min-width:44px;min-height:40px;padding:4px 10px;font-family:var(--num);font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,20,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}.sheet>div{border-radius:18px}}
.sheet h3{margin:0 0 12px;font-size:18px}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:16px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.codepreview{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.codepreview b{font-family:var(--num);font-size:20px;display:block;color:var(--accent)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.warnbox{background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}

/* settings */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.card h2{font-size:16px;margin:0 0 4px}
.card p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.card .actions{justify-content:flex-start;margin-top:0}
.doclist{display:grid;gap:6px;margin-bottom:10px}
.doclist div{display:flex;align-items:center;gap:10px;font-size:15px}
.doclist code{font-family:var(--num);color:var(--accent)}
textarea.raw{width:100%;min-height:140px;font-family:var(--num);font-size:12px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg)}

.xtools{display:grid;gap:8px;margin-top:12px}
.xtools .sep{width:1px;background:var(--line-strong);margin:4px 2px;flex:0 0 1px}
.xalpha{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.xalpha input{flex:1;max-width:320px}
.xwrap{background:#000;border-radius:12px;overflow:hidden;margin-top:6px}
#xCanvas{display:block;max-width:100%}
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:0}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  body.printing{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea .pg{page-break-after:avoid}
}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
@media (max-width:560px){.bar h1{font-size:16px}.bar h1 small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .btn{padding:6px 10px;font-size:14px;min-height:36px}.bar .wrap{gap:6px;padding:0 10px}}
.exams{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.exams .exam{flex:1 0 auto;min-width:128px}
.exams .addspt{flex:0 0 auto;border:1px dashed var(--line-strong);background:transparent;border-radius:12px;padding:8px 12px;font-size:14px;color:var(--accent)}
.tag.warn{color:var(--warn)}.tag.go{color:var(--accent);font-weight:600}.tag.done{color:var(--muted)}
.course{display:inline-block;font-size:11px;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:2px}
.exam{flex:1;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:8px 12px;text-align:left;font-size:15px;font-weight:600}
.exam small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.exam[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft)}
.exports{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 2px}
.exports .sep{width:1px;height:30px;background:var(--line-strong);margin:0 2px}
.tag{color:var(--ok);font-weight:500}
.exbadge{display:inline-block;background:var(--ink);color:var(--bg);font-size:12px;border-radius:6px;padding:1px 7px;vertical-align:1px}
#printRoot{position:fixed;left:-20000px;top:0}
/* ---- print pages (fixed light palette) ---- */
.pg{background:#fff;color:#1a1a1a;box-sizing:border-box;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif}
.pg-l{width:1123px;height:794px;padding:34px 38px}
.pg-p{width:794px;height:1123px;padding:34px 30px}
.pg table{border-collapse:collapse}
.sh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;border-bottom:2px solid #0D6B70;padding-bottom:10px}
.sh h1{font-size:26px;margin:0;letter-spacing:.04em}
.sh p{margin:2px 0 0;color:#5E6E75;font-size:13px}
.info th{font-weight:400;color:#5E6E75;padding:0 6px 0 18px;font-size:13px}
.info td{font-size:16px;font-weight:700}
table.g{width:100%;table-layout:fixed}
.g th,.g td{border:1px solid #B9C5C8;height:31px;text-align:center;font-size:14px;padding:0}
.g th{font-weight:500}
.g .l1{background:#E0EFEF;font-size:15px}
.g .l2{background:#EEF5F5;font-size:12px;color:#3F5056}
.g td.t0{border-left:1.5px solid #6B7B81}
.g td.mid{border-left:3px solid #14232A}
.g td.mx{background:#E6E9EA}
.g tr.post td,.g tr.post th.l2{border-bottom-color:#8C9CA1}
.g .trow th{background:#14232A;color:#fff}
.g .ptn{font-weight:700;font-size:15px;background:#F3F7F7;height:32px}
.g .ptn small{font-size:10px;margin-left:3px;color:#5E6E75;font-weight:500}
.g .tmiss{text-decoration:line-through;color:#8A9599}
.sfoot{margin-top:18px}
.leg{display:flex;gap:24px;font-size:13px;color:#3F5056;margin-bottom:12px}
.leg i{display:inline-block;width:14px;height:14px;border:1px solid;border-radius:3px;vertical-align:-2px;margin-right:6px}
.sboxes{display:flex;gap:12px}
.sbox{flex:1;border:1px solid #CFD9DB;border-radius:10px;padding:10px 14px}
.sbox h4{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between}
.sbox h4 span{color:#5E6E75;font-weight:400}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:12px;color:#5E6E75}
.sgrid b{display:block;font-size:24px;line-height:1.25;color:#14232A}
.sbox p{margin:6px 0 0;font-size:12px;color:#5E6E75}
.sbox .na{font-size:14px;padding:16px 0}
.sbox.imp{flex:0 0 210px;background:#E0EFEF;border-color:#0D6B70}
.imp .big{font-size:34px;font-weight:700;color:#0D6B70;line-height:1.2}
.ah1{text-align:center;font-size:18px;font-weight:700;margin-bottom:10px;line-height:1.35}
.ah1 span{font-size:12px;font-weight:500}
table.ainfo{width:100%;margin-bottom:10px;table-layout:fixed}
.ainfo th,.ainfo td{border:1px solid #000;font-size:10.5px;padding:2px;text-align:center;height:34px;line-height:1.2}
.ainfo th{font-weight:500;background:#fff}
.ainfo td{font-size:12px;font-weight:500}
table.ag{width:100%;table-layout:fixed}
.ag th,.ag td{border:1px solid #000;height:25px;font-size:10.5px;text-align:center;padding:0;line-height:1.1}
.ag th{font-weight:500}
.ag th.y,.ag th.ph{background:#FFFF99}
.ag th.ph{font-size:10px}
.ag tr.pre td{background:#FFFFCC}
.ag td.nf{background:#fff!important}
.ag td.mx{background:#D5D5D5!important}
.ag th.tl{background:#F08080}
.ag td.tp{background:#F4A6CD!important;font-weight:600;font-size:11px}
.ag th.nl{background:#99CCFF}
.ag td.np{background:#CCCCFF;font-size:9.5px}
.ag td.mid{border-left:2px solid #000}
.ag tr.gap td{border:0;height:12px;background:#fff}
.anote{margin-top:14px;font-size:12.5px;line-height:2}
.anote u{display:inline-block;min-width:40px;text-align:center}
.pblk{margin-top:16px}
table.pinfo{width:100%;margin-bottom:4px;table-layout:fixed}
.pinfo th,.pinfo td{border:1px solid #000;font-size:11px;height:26px;font-weight:500;padding:0 4px}
.pinfo th{width:62px}.pinfo th.w{width:170px}.pinfo td{text-align:center}
.pg2 th,.pg2 td{height:21px}
.pg2 td.plq{background:#E8776E}
.plegend{font-size:11px;margin-top:14px;color:#333}
</style>
</head>
<body>
<section id="home">
  <header class="bar"><div class="wrap">
    <h1>立威牙周檢查<small>Periodontal Chart</small></h1>
    <button class="btn ghost" data-go="settings">備份與設定</button>
    <button class="btn primary" data-act="new">新增病人</button>
  </div></header>
  <main class="wrap">
    <div id="storageWarn" class="warnbox" style="margin-top:14px" hidden>這個瀏覽器目前無法儲存資料，關閉頁面後內容會消失。請改用 Safari 或 Chrome 的一般模式（非私密瀏覽）。</div>
    <input id="q" class="search" type="search" placeholder="輸入病人姓名查詢（回診請開舊檔）">
    <div id="list"></div>
  </main>
</section>
<section id="editor" hidden>
  <header class="bar"><div class="wrap">
    <button class="btn ghost" data-go="home" aria-label="返回列表">‹ 列表</button>
    <h1 id="edTitle"></h1>
    <button class="btn" data-act="info">基本資料</button>
  </div></header>
  <main class="wrap">
    <div class="exams" id="exams" role="group" aria-label="檢查階段"></div>
    <div class="stats" id="stats"></div>
    <div class="exports">
      <button class="btn" data-act="simplePng">簡易版 PNG</button>
      <button class="btn" data-act="simplePrint">簡易版列印</button>
      <button class="btn" data-act="simpleXlsx">簡易版 Excel</button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn" data-act="auditPdf">健保抽審 PDF</button>
      <button class="btn" data-act="plaquePdf">牙菌斑控制表 PDF</button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn primary" data-act="xray">X 光對照</button>
    </div>
    <div class="modes" id="modes" role="group" aria-label="輸入項目"></div>
    <p class="hint" id="modeHint"></p>
    <div class="chartbox" id="chart"></div>
    <div class="dist" id="dist"></div>
    <div class="pad" id="pad"></div>
  </main>
</section>
<section id="xray" hidden>
  <header class="bar"><div class="wrap">
    <button class="btn ghost" data-go="editor" aria-label="返回檢查">‹ 返回</button>
    <h1 id="xTitle"></h1>
  </div></header>
  <main class="wrap">
    <div id="xEmpty" class="empty">還沒有這位病人的 X 光。<br>請先從 X 光系統把全口平面 X 光存成圖片（JPG／PNG），再選擇它。<br>
      <label class="btn primary" style="display:inline-flex;align-items:center;margin-top:14px">選擇 X 光圖片<input type="file" accept="image/*" id="xFile" hidden></label>
      <p class="hint" style="margin-top:14px">X 光只存在這台裝置，不會上傳，也不會放進備份檔。</p></div>

<div id="printArea" aria-hidden="true"></div>
<script>(function(){
"use strict";
/* ================= constants ================= */
const KEY="lw_perio_v2";
const UR=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const LR=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const ALL=UR.concat(LR);
const FURC={};[16,17,18,26,27,28].forEach(t=>FURC[t]=["b","m","d"]);[14,24].forEach(t=>FURC[t]=["m","d"]);[36,37,38,46,47,48].forEach(t=>FURC[t]=["b","l"]);
const FURC_LAB={b:"頰側",m:"近心",d:"遠心",l:"舌側"};
const ROMAN=["0","I","II","III"];
const EXN={pre:"初診（術前）",post:"再評估（術後）"};
const MODES=[
  {k:"pd",n:"探測深度 PD",h:"點數字後自動跳下一格。順序：上顎頰側 → 上顎顎側 → 下顎舌側 → 下顎頰側，缺牙自動略過。"},
  {k:"gm",n:"牙齦位置 GM",h:"以 CEJ 為基準：牙齦退縮為正數，牙齦覆蓋過 CEJ 為負數。"},
  {k:"cal",n:"附連喪失 CAL",h:"CAL = PD + GM，自動計算，不需輸入。"},
  {k:"bop",n:"出血 BOP",h:"每個部位選「出血」或「無」，自動跳下一格。"},
  {k:"pl",n:"牙菌斑",h:"每個部位選「有」或「無」，自動跳下一格。"},
  {k:"tooth",n:"牙齒狀態",h:"點牙位號碼，設定缺牙、植體、動搖度（D＝垂直可下壓）、角化牙齦與根分岔（以 mm 計）。缺牙與植體初診、再評估共用。"}
];
const DEFAULT_DOCTORS=[{zh:"黃振邦",en:"Huang"},{zh:"蔡世軒",en:"Tsai"}];
const LIB={
  h2c:"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
  pdf:"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
  xls:"https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"
};

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const ymd=d=>String(d||"").replace(/-/g,"");
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2800)}
function siteOrder(t){const q=Math.floor(t/10);return(q===1||q===4)?["d","c","m"]:["m","c","d"]}
function sk(t){const o=[];["f","l"].forEach(s=>["d","c","m"].forEach(p=>o.push(t+s+p)));return o}
const blankEx=()=>({tooth:{},sites:{}});
function T(r,t){return r.teeth[t]||(r.teeth[t]={missing:false,implant:false})}
function ET(r,k,t){const e=r.ex[k];return e.tooth[t]||(e.tooth[t]={mob:null,km:null,furc:{}})}
function SI(r,k,key){const e=r.ex[k];return e.sites[key]||(e.sites[key]={pd:null,gm:null,bop:false,pl:false})}
const isSpt=k=>typeof k==="string"&&k[0]==="s"&&k.length>1;
function hasPl(e){return!!e&&Object.keys(e.sites).some(k=>e.sites[k].plSet)}
function days(d,to){if(!d)return null;const a=new Date(d+"T00:00:00"),b=new Date((to||today())+"T00:00:00");return Math.round((b-a)/864e5)}
function addDays(d,n){const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function norm(r){r.spt=r.spt||[];r.srpDate=r.srpDate||"";r.course=r.course||1;r.spt.forEach(v=>{r.ex[v.k]=r.ex[v.k]||blankEx()});return r}
function sptMeta(r,k){return r.spt.find(v=>v.k===k)}
function cal(s){return s&&s.pd!=null?s.pd+(s.gm||0):null}
function hasData(e){return!!e&&Object.keys(e.sites).some(k=>{const s=e.sites[k];return s.pd!=null||s.bopSet||s.plSet})}
const loaded={};
function loadLib(url){if(loaded[url])return loaded[url];
  loaded[url]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=url;s.onload=res;s.onerror=()=>{delete loaded[url];rej(new Error("元件載入失敗，請確認網路連線後再試"))};document.head.appendChild(s)});
  return loaded[url];}

/* ================= storage ================= */
let storageOK=true;
function migrateV1(old){
  return (old.records||[]).map(r=>{
    const teeth={},tooth={};
    Object.keys(r.teeth||{}).forEach(t=>{const x=r.teeth[t];teeth[t]={missing:!!x.missing,implant:!!x.implant};tooth[t]={mob:x.mob==null?null:x.mob,km:x.km==null?null:x.km,furc:x.furc||{}}});
    return {id:r.id,code:r.code,doctor:r.doctor,postDoctor:null,name:r.name||"",idNo:"",chartNo:r.chartNo||"",gender:r.gender||"",age:r.age||"",note:r.note||"",
      preDate:r.date||today(),postDate:"",teeth,ex:{pre:{tooth,sites:r.sites||{}},post:blankEx()},createdAt:r.createdAt||Date.now(),updatedAt:r.updatedAt||Date.now()};
  });
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const s=JSON.parse(raw);s.records=(s.records||[]).map(norm);if(!s.doctors||!s.doctors.length)s.doctors=DEFAULT_DOCTORS.slice();return s}
    const v1=localStorage.getItem("lw_perio_v1");
    if(v1){const o=JSON.parse(v1);return{records:migrateV1(o),doctors:o.doctors&&o.doctors.length?o.doctors:DEFAULT_DOCTORS.slice(),lastBackupAt:0}}
  }catch(e){storageOK=false}
  return{records:[],doctors:DEFAULT_DOCTORS.slice(),lastBackupAt:0};
}
let S=load();
try{localStorage.setItem(KEY+"_t","1");localStorage.removeItem(KEY+"_t")}catch(e){storageOK=false}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false;toast("儲存失敗：此瀏覽器無法寫入資料")}}

/* ================= file delivery ================= */
let DL=null;
(async function(){
  if(!(window.claude&&window.claude.use))return;
  try{DL=await window.claude.use("downloads")}catch(e){DL=null}
})();
const MIME={png:"image/png",pdf:"application/pdf",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",json:"application/json"};
async function deliver(filename,blob){
  const ext=filename.split(".").pop();
  if(DL){try{await DL.save({filename,data:blob});toast("已儲存 "+filename);return true}catch(e){if(e&&e.code==="declined"){toast("已取消");return false}}}
  const touch=window.matchMedia("(pointer:coarse)").matches;
  if(touch&&navigator.canShare){
    try{const f=new File([blob],filename,{type:MIME[ext]||"application/octet-stream"});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true}}
    catch(e){if(e&&e.name==="AbortError"){toast("已取消");return false}}
  }
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);toast("已下載 "+filename);return true;
}

/* ================= stats ================= */
function stats(r,k){
  let present=0,bop=0,pl=0,n4=0,n5=0,n6=0,meas=0,sumPD=0,deepTeeth=0;const e=r.ex[k];
  ALL.forEach(t=>{
    if(T(r,t).missing)return;present++;let deep=false;
    sk(t).forEach(key=>{const x=e.sites[key];if(!x)return;if(x.bop)bop++;if(x.pl)pl++;
      if(x.pd!=null){meas++;sumPD+=x.pd;if(x.pd>=4&&x.pd<=5)n4++;if(x.pd>=6)n6++;if(x.pd>=5){n5++;deep=true}}});
    if(deep)deepTeeth++;
  });
  const den=present*6;
  return{present,bopP:den?bop/den*100:0,plP:den?pl/den*100:0,n4,n5,n6,meas,ok:meas-n4-n6,meanPD:meas?sumPD/meas:0,deepTeeth};
}
function improve(r){
  let total=0,deep=0,imp=0;
  ALL.forEach(t=>{const tt=T(r,t);if(tt.missing||tt.implant)return;total++;
    const keys=sk(t);if(!keys.some(k=>{const a=r.ex.pre.sites[k];return a&&a.pd!=null&&a.pd>=5}))return;deep++;
    if(keys.some(k=>{const a=r.ex.pre.sites[k],b=r.ex.post.sites[k];return a&&b&&a.pd!=null&&b.pd!=null&&a.pd-b.pd>=2}))imp++;});
  return{total,deep,imp,rate:deep?imp/deep*100:null,hasPost:hasData(r.ex.post)};
}

/* ================= codes ================= */
function nextCode(en,date,exceptId){
  const p=en+ymd(date);let max=0;
  S.records.forEach(r=>{if(r.id!==exceptId&&r.code&&r.code.indexOf(p)===0){const n=parseInt(r.code.slice(p.length),10);if(!isNaN(n)&&n>max)max=n}});
  return p+String(max+1).padStart(2,"0");
}
function seqOf(r){
  const out=[];const add=(teeth,surf,rev)=>{let c=[];teeth.forEach(t=>siteOrder(t).forEach(p=>c.push({t,surf,p})));if(rev)c.reverse();c.forEach(x=>{if(!T(r,x.t).missing)out.push(x)})};
  add(UR,"f",false);add(UR,"l",true);add(LR,"l",false);add(LR,"f",true);return out;
}

/* ================= navigation ================= */
let cur=null,ek="pre",mode="pd",cursor=0,selTooth=16;
function go(v){["home","editor","settings","xray"].forEach(id=>$("#"+id).hidden=id!==v);window.scrollTo(0,0);
  if(v==="home")renderHome();if(v==="settings")renderSettings();if(v==="editor")renderEditor();}
function openRec(r){cur=r;ek=hasData(r.ex.post)?"post":"pre";mode="pd";cursor=0;go("editor")}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="new")openNew();
  else if(act==="info")openInfo();
  else if(act==="simplePng")run(a,()=>exportSimplePng(cur));
  else if(act==="simplePrint")printSimple(cur);
  else if(act==="xray")openXray();
  else if(act==="simpleXlsx")run(a,()=>exportSimpleXlsx(cur));
  else if(act==="auditPdf")auditCheck();
  else if(act==="plaquePdf")run(a,()=>exportPlaque(cur));
});
async function run(btn,fn){if(btn.disabled)return;const t=btn.textContent;btn.disabled=true;btn.textContent="產生中…";
  try{await fn()}catch(e){toast(e&&e.message?e.message:"匯出失敗")}finally{btn.disabled=false;btn.textContent=t}}

/* ================= status ================= */
function lastSpt(r){return r.spt.reduce((m,v)=>!m||v.date>m?v.date:m,"")}
function nextSptDate(r){if(!r.srpDate)return null;let d=addDays(r.srpDate,90);const l=lastSpt(r);if(l){const n=addDays(l,90);if(n>d)d=n}return d}
function status(r){
  const out=[];
  const nx=S.records.find(x=>x.prevId===r.id);if(nx)return[["done","已開第 "+nx.course+" 療程（"+nx.code+"）"]];
  if(!hasData(r.ex.post)){
    const pd=days(r.preDate);
    if(!r.srpDate)out.push(["done","待 91022C 刮除（完成後在基本資料填 SRP 日期）"]);
    else{const d=days(r.srpDate);out.push(d<28?["","91023C 再評估：還要 "+(28-d)+" 天（"+addDays(r.srpDate,28)+" 起）"]:["go","可做 91023C 再評估"])}
    if(pd!=null&&pd>=150)out.push(["warn","療程第 "+pd+" 天，上限 180 天"]);
  }else{
    const ns=nextSptDate(r);
    if(ns)out.push(ns<=today()?["go","可做 91018C 支持性治療"]:["done","下次 91018C："+ns+" 起"]);
    if(days(r.preDate)>=365)out.push(["go","已滿一年，可再收案（開新療程）"]);
    else out.push(["done","可再收案："+addDays(r.preDate,365)+" 起"]);
  }
  return out;
}

/* ================= home ================= */
function renderHome(){
  $("#storageWarn").hidden=storageOK;
  const q=$("#q").value.trim().toLowerCase();
  const recs=S.records.filter(r=>!q||[r.name,r.chartNo,r.code].join(" ").toLowerCase().includes(q))
    .sort((a,b)=>(b.preDate||"").localeCompare(a.preDate||"")||(b.code||"").localeCompare(a.code||""));
  const list=$("#list");
  if(!S.records.length){list.innerHTML='<div class="empty">還沒有任何病人檔案。<br><button class="btn primary" data-act="new">新增第一位病人</button></div>';return}
  if(!recs.length){list.innerHTML='<div class="empty">找不到「'+esc(q)+'」。如果是新病人，請按「新增病人」。</div>';return}
  let h="",last="";
  recs.forEach(r=>{
    if(r.preDate!==last){if(last)h+="</div>";h+='<div class="daygroup"><h2>'+esc(r.preDate)+' 初診</h2>';last=r.preDate}
    const post=hasData(r.ex.post);const st=stats(r,post?"post":"pre");
    h+='<button class="rec" data-open="'+esc(r.id)+'"><span class="code">'+esc(r.code)+'</span><span class="who">'+esc(r.name||"（未填姓名）")+'</span>'+
      '<span class="bop"><b>'+st.bopP.toFixed(0)+'%</b>BOP</span>'+
      '<span class="meta" style="grid-column:1/3">'+esc(r.doctor.zh)+' 醫師'+(r.chartNo?'・病歷號 '+esc(r.chartNo):'')+(r.course>1?'<span class="course">第 '+r.course+' 療程</span>':'')+'<br>'+status(r).map(x=>'<span class="tag '+x[0]+'">'+esc(x[1])+'</span>').join('・')+'</span></button>';
  });
  list.innerHTML=h+"</div>";
}
$("#q").addEventListener("input",renderHome);
$("#list").addEventListener("click",e=>{const b=e.target.closest("[data-open]");if(!b)return;const r=S.records.find(x=>x.id===b.dataset.open);if(r)openRec(r)});

/* ================= sheets ================= */
function openSheet(html){$("#sheetBody").innerHTML=html;$("#sheet").hidden=false}
function closeSheet(){$("#sheet").hidden=true}
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
function docOptions(sel,allowBlank){return(allowBlank?'<option value="">（同初診醫師）</option>':"")+S.doctors.map((d,i)=>'<option value="'+i+'"'+(sel&&sel.en===d.en&&sel.zh===d.zh?" selected":"")+'>'+esc(d.zh)+'（'+esc(d.en)+'）</option>').join("")}
function patientFields(r){
  return '<div class="two"><label>病人姓名<input name="name" autocomplete="off" value="'+esc(r?r.name:"")+'"></label>'+
  '<label>病歷號<input name="chartNo" autocomplete="off" value="'+esc(r?r.chartNo:"")+'"></label></div>'+
  '<label>身分證字號（健保抽審用）<input name="idNo" autocomplete="off" autocapitalize="characters" value="'+esc(r?r.idNo:"")+'"></label>'+
  '<div class="two"><label>性別<select name="gender">'+["","男","女"].map(s=>'<option'+(r&&r.gender===s?" selected":"")+'>'+s+'</option>').join("")+'</select></label>'+
  '<label>年齡<input name="age" type="number" inputmode="numeric" min="0" max="120" value="'+esc(r?r.age:"")+'"></label></div>';
}
function readForm(){const f={};$("#sheetBody").querySelectorAll("[name]").forEach(el=>f[el.name]=el.value.trim());return f}
function findSame(f){return S.records.filter(r=>(f.name&&r.name===f.name)||(f.chartNo&&r.chartNo===f.chartNo)||(f.idNo&&r.idNo&&r.idNo.toUpperCase()===f.idNo.toUpperCase()))}
function openNew(){
  if(!S.doctors.length){toast("請先到「備份與設定」新增醫師");return}
  openSheet('<h3>新增病人（初診）</h3><div class="form"><label>初診醫師<select name="doc">'+docOptions(null)+'</select></label>'+
    '<label>初診日期<input name="date" type="date" value="'+today()+'"></label>'+patientFields(null)+
    '<div class="codepreview">檔名編號<b id="codePrev"></b></div><div id="dupWarn"></div></div>'+
    '<div class="actions"><button class="btn" id="cancelNew">取消</button><button class="btn primary" id="okNew">建立並開始輸入</button></div>');
  const upd=()=>{const f=readForm();const d=S.doctors[+f.doc];$("#codePrev").textContent=d?nextCode(d.en,f.date||today()):"";
    const same=findSame(f);
    $("#dupWarn").innerHTML=same.length?'<div class="warnbox">已經有相同姓名、病歷號或身分證字號的檔案。<b>回診請直接開啟舊檔</b>，在「再評估」輸入即可：'+
      same.map(r=>'<button class="btn" style="margin:8px 8px 0 0" data-dup="'+esc(r.id)+'">'+esc(r.code)+'　'+esc(r.name)+'</button>').join("")+'</div>':""};
  const body=$("#sheetBody");body.oninput=upd;body.onchange=upd;upd();
  body.onclick=e=>{const b=e.target.closest("[data-dup]");if(b){const r=S.records.find(x=>x.id===b.dataset.dup);closeSheet();if(r)openRec(r)}};
  $("#cancelNew").onclick=closeSheet;
  $("#okNew").onclick=()=>{
    const f=readForm();const d=S.doctors[+f.doc];if(!d)return;const date=f.date||today();
    if(!f.name){toast("請填病人姓名，回診時才找得到");return}
    const r={id:uid(),code:nextCode(d.en,date),doctor:{zh:d.zh,en:d.en},postDoctor:null,name:f.name,idNo:f.idNo.toUpperCase(),chartNo:f.chartNo,gender:f.gender,age:f.age,note:"",
      preDate:date,postDate:"",teeth:{},ex:{pre:blankEx(),post:blankEx()},createdAt:Date.now(),updatedAt:Date.now()};
    norm(r);S.records.push(r);persist();closeSheet();openRec(r);
  };
}
function openInfo(){
  const r=cur;
  openSheet('<h3>基本資料・'+esc(r.code)+'</h3><div class="form">'+patientFields(r)+
    '<div class="two"><label>初診醫師<select name="doc">'+docOptions(r.doctor)+'</select></label><label>初診日期<input name="preDate" type="date" value="'+esc(r.preDate)+'"></label></div>'+
    '<div class="two"><label>再評估醫師<select name="pdoc">'+docOptions(r.postDoctor,true)+'</select></label><label>再評估日期<input name="postDate" type="date" value="'+esc(r.postDate)+'"></label></div>'+
    '<label>SRP 刮除日期（91022C）<input name="srpDate" type="date" value="'+esc(r.srpDate)+'"></label>'+
    (isSpt(ek)?'<label>這次支持性治療（91018C）日期<input name="sptDate" type="date" value="'+esc(sptMeta(r,ek).date)+'"></label>':'')+
    '<label>備註<textarea name="note" rows="2">'+esc(r.note)+'</textarea></label><p class="hint">檔名編號建立後固定不變。</p>'+
    '<button class="btn" id="newCourse" type="button">開始新療程（滿一年再收案）</button>'+
    (isSpt(ek)?'<button class="btn danger" id="delSpt" type="button">刪除這次支持性治療紀錄</button>':'')+'</div>'+
    '<div class="actions"><button class="btn danger" id="delRec">刪除這位病人</button><span style="flex:1"></span><button class="btn" id="cInfo">取消</button><button class="btn primary" id="sInfo">儲存</button></div>');
  $("#cInfo").onclick=closeSheet;
  $("#sInfo").onclick=()=>{const f=readForm();const d=S.doctors[+f.doc];if(d)r.doctor={zh:d.zh,en:d.en};
    const pd=f.pdoc===""?null:S.doctors[+f.pdoc];r.postDoctor=pd?{zh:pd.zh,en:pd.en}:null;
    Object.assign(r,{name:f.name,chartNo:f.chartNo,idNo:f.idNo.toUpperCase(),gender:f.gender,age:f.age,preDate:f.preDate||r.preDate,postDate:f.postDate,srpDate:f.srpDate,note:f.note,updatedAt:Date.now()});
    if(isSpt(ek)&&f.sptDate)sptMeta(r,ek).date=f.sptDate;
    persist();closeSheet();renderEditor()};
  $("#newCourse").onclick=newCourse;

function cls(v,kind){if(v==null)return"";if(kind==="cal")return v<=2?"ok":v<=4?"warn":"deep";return v<=3?"ok":v<=5?"warn":"deep"}
function cellHTML(t,surf,p,first,midline,curKey){
  const k=t+surf+p;const s=cur.ex[ek].sites[k];
  let c="c"+(first?(midline?" mid":" t0"):""),inner="";
  if(T(cur,t).missing){return'<div class="'+c+' miss"></div>'}
  if(mode==="pd"||mode==="tooth"){const v=s&&s.pd;if(v!=null){inner=v;if(mode==="pd")c+=" "+cls(v)}}
  else if(mode==="gm"){const v=s&&s.gm;if(v!=null)inner=v}
  else if(mode==="cal"){const v=cal(s);if(v!=null){inner=v;c+=" "+cls(v,"cal")}}
  else if(mode==="bop"){inner=s&&s.bop?'<span class="dot"></span>':(s&&s.bopSet?'<span class="dot no"></span>':"")}
  else if(mode==="pl"){inner=s&&s.pl?'<span class="dot pl"></span>':(s&&s.plSet?'<span class="dot no"></span>':"")}
  if(k===curKey&&mode!=="cal"&&mode!=="tooth")c+=" cur";
  return'<button class="'+c+'" data-k="'+k+'" aria-label="'+t+' '+{d:"遠心",c:"中央",m:"近心"}[p]+'">'+inner+'</button>';
}
function rowHTML(teeth,surf,label,curKey){let h='<div class="lab">'+label+'</div>';teeth.forEach((t,i)=>siteOrder(t).forEach((p,j)=>{h+=cellHTML(t,surf,p,j===0,i===8,curKey)}));return h}

function toothClick(e){
  const tt=T(cur,selTooth),et=ET(cur,ek,selTooth);let b;

const PC={ok:["#DDF1E5","#1D6A44"],warn:["#FCEBC6","#8A5A0A"],deep:["#F7CBC6","#A3271E"]};
function pdStyle(v){if(v==null)return"";const c=PC[cls(v)];return"background:"+c[0]+";color:"+c[1]+";font-weight:"+(v>=6?700:500)}
async function renderPages(htmlPages,orient){
  await loadLib(LIB.h2c);await loadLib(LIB.pdf);

  const root=$("#printRoot");const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:orient,unit:"mm",format:"a4"});

const NEON={ok:"#39FF14",warn:"#FFF01F",deep:"#FF3131"};
const XW={18:10,17:10,16:10,15:7,14:7,13:8,12:6.5,11:8.5,48:11,47:11,46:11,45:7,44:7,43:7,42:5.5,41:5.5};
function xw(t){const q=Math.floor(t/10),n=t%10;return XW[(q<=2?10:40)+n]||7}
const XDEF={ur:[.305,.455],um:[.5,.50],ul:[.695,.455],lr:[.31,.585],lm:[.5,.625],ll:[.69,.585]};
const XH_LAB={ur:"18 端",um:"上中線",ul:"28 端",lr:"48 端",lm:"下中線",ll:"38 端"};
function idb(){return new Promise((res,rej)=>{const q=indexedDB.open("lw_perio_img",1);q.onupgradeneeded=()=>q.result.createObjectStore("xray");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function imgOp(fn,mode){const db=await idb();return new Promise((res,rej)=>{const st=db.transaction("xray",mode||"readonly").objectStore("xray");const q=fn(st);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
const imgGet=id=>imgOp(s=>s.get(id));
const imgPut=(id,v)=>imgOp(s=>s.put(v,id),"readwrite");
const imgDel=id=>imgOp(s=>s.delete(id),"readwrite");
function lag(p0,p1,p2,x){const [x0,y0]=p0,[x1,y1]=p1,[x2,y2]=p2;
  const d0=(x0-x1)*(x0-x2),d1=(x1-x0)*(x1-x2),d2=(x2-x0)*(x2-x1);
  if(!d0||!d1||!d2)return y1;
  return y0*(x-x1)*(x-x2)/d0+y1*(x-x0)*(x-x2)/d1+y2*(x-x0)*(x-x1)/d2}
function toothPos(xr){
  const P=xr.pts,pos={};
  const arch=(teeth,a,m,b)=>{
    const half=(list,from,to)=>{const tot=list.reduce((s,t)=>s+xw(t),0);let acc=0;
      list.forEach(t=>{const c=(acc+xw(t)/2)/tot;acc+=xw(t);const x=from[0]+(to[0]-from[0])*c;pos[t]=[x,lag(a,m,b,x)]})};
    const L=teeth.slice(0,8),R=teeth.slice(8);
    // 端點在最後一顆牙的中心：把端點往外延半顆牙
    const ext=(end,mid,list)=>{const tot=list.reduce((s,t)=>s+xw(t),0);const k=(xw(list[0])/2)/(tot-xw(list[0])/2);return[end[0]-(mid[0]-end[0])*k,end[1]]};
    half(L,ext(a,m,L),m);half(R.slice().reverse(),ext(b,m,R.slice().reverse()),m);
  };
  arch(UR,P.ur,P.um,P.ul);arch(LR,P.lr,P.lm,P.ll);
  Object.keys(xr.off||{}).forEach(t=>{if(pos[t]){pos[t]=[pos[t][0]+xr.off[t][0],pos[t][1]+xr.off[t][1]]}});
  return pos;
}

  const dpr=exp?1:(window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  if(!exp){cv.style.width=W+"px";cv.style.height=H+"px"}
  const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
  g.drawImage(im,0,0,W,H);
  const xr=cur.xray;const pos=toothPos(xr);const e=cur.ex[XV.k];
  const fs=W*0.019,sm=W*0.0105;
  const label=(txt,x,y,size,color,bg)=>{
    g.font="800 "+size+"px 'IBM Plex Sans','Noto Sans TC',Arial,sans-serif";g.textAlign="center";g.textBaseline="middle";
    if(bg&&XV.alpha>0){const w=g.measureText(String(txt)).width+size*.55;g.globalAlpha=XV.alpha;g.fillStyle=color;
      g.beginPath();if(g.roundRect)g.roundRect(x-w/2,y-size*.62,w,size*1.24,size*.3);else g.rect(x-w/2,y-size*.62,w,size*1.24);g.fill();g.globalAlpha=1}
    g.lineJoin="round";g.lineWidth=Math.max(2,size*.2);g.strokeStyle="rgba(0,0,0,.92)";g.strokeText(txt,x,y);
    g.shadowColor=color;g.shadowBlur=size*.45;g.fillStyle=color;g.fillText(txt,x,y);g.shadowBlur=0;
  };
  ALL.forEach(t=>{
    const p=pos[t];if(!p)return;const x=p[0]*W,y=p[1]*H;const tt=T(cur,t);
    if(tt.missing){label("X",x,y,fs*.8,"#E6EEF0",false);return}
    const keys=sk(t);const vals=keys.map(k=>{const s=e.sites[k];return s&&s.pd!=null?s.pd:null});
    if(XV.six){
      const up=t<30;const order=p=>siteOrder(t).map(q=>t+p+q);
      const rowF=order("f").map(k=>{const s=e.sites[k];return s&&s.pd!=null?s.pd:null}),rowL=order("l").map(k=>{const s=e.sites[k];return s&&s.pd!=null?s.pd:null});
      const arr=up?UR:LR,ix=arr.indexOf(t),nb=pos[arr[ix+(ix<15?1:-1)]];
      const span=nb?Math.abs(nb[0]-p[0])*W:sm*3.2;const gap=Math.min(sm*1.05,span/3.1),fz=Math.min(sm,gap*1.2),dy=fz*.68;
      [[rowF,up?-dy:dy],[rowL,up?dy:-dy]].forEach(([row,oy])=>row.forEach((v,i)=>{if(v==null)return;label(String(v),x+(i-1)*gap,y+oy,fz,NEON[cls(v)],true)}));
    }else{
      const m=vals.filter(v=>v!=null);if(!m.length){if(tt.implant)label("植",x,y,fs*.6,"#E6EEF0",false);return}
      const mx=Math.max(...m);label(String(mx),x,y,fs,NEON[cls(mx)],true);
    }
    if(tt.implant)label("植",x,y+(t<30?-1:1)*fs*.95,fs*.5,"#E6EEF0",false);
  });
  if(!exp){
    // 圖例
    const lg=[["1–3",NEON.ok],["4–5",NEON.warn],["≥6",NEON.deep]];
    g.font="700 "+(W*.013)+"px sans-serif";g.textAlign="left";g.textBaseline="middle";
    let lx=W*.015;const ly=H*.04;g.lineWidth=4;g.strokeStyle="rgba(0,0,0,.9)";lg.forEach(([t,c])=>{g.strokeText(t+" mm",lx,ly);g.fillStyle=c;g.fillText(t+" mm",lx,ly);lx+=g.measureText(t+" mm").width+W*.02});
  }else{
    const tag=(XV.k==="pre"?"術前 ":"術後 ")+(XV.k==="pre"?cur.preDate:cur.postDate||"");
    g.font="700 "+(W*.014)+"px 'Noto Sans TC',sans-serif";g.textAlign="right";g.textBaseline="top";
    g.lineWidth=4;g.strokeStyle="rgba(0,0,0,.9)";g.strokeText(tag,W*.985,H*.02);g.fillStyle="#fff";g.fillText(tag,W*.985,H*.02);
    const lg=[["1–3 mm",NEON.ok],["4–5 mm",NEON.warn],["≥6 mm",NEON.deep]];g.textAlign="left";
    let lx=W*.015;lg.forEach(([t,c])=>{g.strokeText(t,lx,H*.02);g.fillStyle=c;g.fillText(t,lx,H*.02);lx+=g.measureText(t).width+W*.02});
  }
  if(XV.calib&&!exp){
    Object.keys(XH_LAB).forEach(k=>{const [px,py]=xr.pts[k];const x=px*W,y=py*H;
      g.beginPath();g.arc(x,y,W*.016,0,Math.PI*2);g.fillStyle="rgba(77,178,180,.35)";g.fill();g.lineWidth=3;g.strokeStyle="#4DB2B4";g.stroke();
      g.font="700 "+(W*.011)+"px sans-serif";g.fillStyle="#fff";g.textAlign="center";g.textBaseline="bottom";g.strokeStyle="#000";g.lineWidth=3;
      g.strokeText(XH_LAB[k],x,y-W*.019);g.fillText(XH_LAB[k],x,y-W*.019)});
    ALL.forEach(t=>{const p=pos[t];if(!p)return;g.beginPath();g.arc(p[0]*W,p[1]*H,W*.006,0,Math.PI*2);g.fillStyle="#fff";g.fill();g.lineWidth=1.5;g.strokeStyle="#0D6B70";g.stroke();
      g.font="600 "+(W*.0085)+"px sans-serif";g.fillStyle="#fff";g.textAlign="center";g.textBaseline=t<30?"bottom":"top";g.fillText(t,p[0]*W,p[1]*H+(t<30?-1:1)*W*.008)});
  }
}
async function onXrayFile(e){
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const url=URL.createObjectURL(f);const im=new Image();
    await new Promise((res,rej)=>{im.onload=res;im.onerror=()=>rej(new Error("無法讀取這個檔案，請選 JPG 或 PNG 圖片"));im.src=url});
    const max=2600,s=Math.min(1,max/im.naturalWidth);const c=document.createElement("canvas");
    c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const blob=await new Promise(res=>c.toBlob(res,"image/jpeg",0.9));
    await imgPut(cur.id,blob);
    const keep=cur.xray&&cur.xray.pts;
    cur.xray={pts:keep?cur.xray.pts:JSON.parse(JSON.stringify(XDEF)),off:keep?(cur.xray.off||{}):{},added:today()};
    cur.updatedAt=Date.now();persist();
    XV.calib=!keep;await loadXrayImg();
    toast(keep?"已換上新的 X 光，沿用原本的對位":"請拖動 6 個大圓點，對準牙齒位置");
  }catch(err){toast(err&&err.message?err.message:"儲存 X 光失敗")}
}
async function exportXrayPng(){
  const c=document.createElement("canvas");drawXray(c);
  const blob=await new Promise(res=>c.toBlob(res,"image/png"));

function xPoint(ev){const cv=$("#xCanvas");const b=cv.getBoundingClientRect();return[(ev.clientX-b.left)/b.width,(ev.clientY-b.top)/b.height,b]}
function bindXray(){
  const cv=$("#xCanvas");
  cv.addEventListener("pointerdown",ev=>{
    if(!XV.calib||!cur||!cur.xray)return;
    const [x,y,b]=xPoint(ev);const ar=b.height/b.width;const d=(p)=>Math.hypot(p[0]-x,(p[1]-y)*ar);
    let best=null,bd=.03;
    Object.keys(cur.xray.pts).forEach(k=>{const dd=d(cur.xray.pts[k]);if(dd<bd){bd=dd;best={h:k}}});
    if(!best){const pos=toothPos(cur.xray);let td=.015;ALL.forEach(t=>{if(!pos[t])return;const dd=d(pos[t]);if(dd<td){td=dd;best={t,start:[x,y],o:(cur.xray.off[t]||[0,0]).slice()}}})}
    if(!best)return;XV.drag=best;cv.setPointerCapture(ev.pointerId);ev.preventDefault();
  });
  cv.addEventListener("pointermove",ev=>{
    if(!XV.drag)return;const [x,y]=xPoint(ev);const dr=XV.drag;
    const cx=Math.min(1,Math.max(0,x)),cy=Math.min(1,Math.max(0,y));
    if(dr.h)cur.xray.pts[dr.h]=[cx,cy];
    else cur.xray.off[dr.t]=[dr.o[0]+(cx-dr.start[0]),dr.o[1]+(cy-dr.start[1])];
    drawXray();
  });
  const end=()=>{if(XV.drag){XV.drag=null;cur.updatedAt=Date.now();persist()}};
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  $("#xTools").addEventListener("click",ev=>{
    const b=ev.target.closest("[data-xk],[data-x6],[data-xcal]");if(!b)return;
    if(b.dataset.xk)XV.k=b.dataset.xk;
    if(b.dataset.x6!=null)XV.six=b.dataset.x6==="1";
    if(b.dataset.xcal)XV.calib=!XV.calib;
    renderXray();
  });
  $("#xFile").onchange=onXrayFile;
  window.addEventListener("resize",()=>{if(!$("#xray").hidden)drawXray()});
}

/* ================= backup ================= */
function pack(recs){return JSON.stringify({app:"leaderway-perio",version:2,exportedAt:new Date().toISOString(),records:recs})}
function stamp(){const d=new Date();return ymd(today())+"_"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")}
async function doExport(onlyNew){
  const recs=onlyNew?S.records.filter(r=>(r.updatedAt||0)>(S.lastBackupAt||0)):S.records;
  if(!recs.length){toast(onlyNew?"上次備份後沒有新增或修改的資料":"目前沒有資料可備份");return}
  const ok=await deliver("立威牙周備份_"+stamp()+(onlyNew?"_新增":"")+".json",new Blob([pack(recs)],{type:MIME.json}));
  if(ok){S.lastBackupAt=Date.now();persist();renderSettings()}
}
function mergeImport(text){
  let data;try{data=JSON.parse(text)}catch(e){toast("檔案格式錯誤，無法讀取");return}
  if(!data||data.app!=="leaderway-perio"||!Array.isArray(data.records)){toast("這不是立威牙周備份檔");return}
  let recs=data.records;if(data.version===1)recs=migrateV1({records:recs});
  let added=0,updated=0,skipped=0,renum=0;
  recs.forEach(r=>{
    if(!r||!r.id||!r.code||!r.doctor||!r.ex)return;r.teeth=r.teeth||{};r.ex.pre=r.ex.pre||blankEx();r.ex.post=r.ex.post||blankEx();norm(r);
    const i=S.records.findIndex(x=>x.id===r.id);
    if(i>=0){if((r.updatedAt||0)>(S.records[i].updatedAt||0)){r.code=S.records[i].code;S.records[i]=r;updated++}else skipped++}
    else{if(S.records.some(x=>x.code===r.code)){r.code=nextCode(r.doctor.en,r.preDate,r.id);renum++}S.records.push(r);added++}
  });
  persist();renderSettings();
  openSheet('<h3>匯入完成</h3><p>新增 <b>'+added+'</b> 位、更新 <b>'+updated+'</b> 位、略過 <b>'+skipped+'</b> 位（已是最新）'+(renum?'。<br>另有 '+renum+' 位因編號與本機不同病人重複，已自動改為下一個序號。':'。')+'</p><div class="actions"><button class="btn primary" id="okImp">好</button></div>');
  $("#okImp").onclick=closeSheet;
}
function renderSettings(){
  const changed=S.records.filter(r=>(r.updatedAt||0)>(S.lastBackupAt||0)).length;
  const size=(new Blob([JSON.stringify(S)]).size/1024).toFixed(0);
  const last=S.lastBackupAt?new Date(S.lastBackupAt).toLocaleString("zh-TW"):"尚未備份";
  $("#setBody").innerHTML=
  '<div class="card"><h2>匯出備份</h2><p>上次備份：'+esc(last)+'。之後新增或修改了 '+changed+' 位病人。建議每週備份一次，存到診所電腦。</p>'+
   '<div class="actions"><button class="btn primary" id="expNew"'+(changed?"":" disabled")+'>匯出新增／修改的 '+changed+' 位</button><button class="btn" id="expAll">匯出全部 '+S.records.length+' 位</button></div></div>'+
  '<div class="card"><h2>匯入備份</h2><p>依每位病人的唯一編號合併：同一位只保留最新修改的版本，不會重複。</p>'+
   '<div class="actions"><label class="btn primary" style="display:inline-flex;align-items:center">選擇備份檔<input type="file" id="impFile" accept=".json,application/json" hidden></label></div></div>'+
  '<div class="card"><h2>醫師名單</h2><p>英文姓用於檔名開頭，例如 Huang2026100601。</p><div class="doclist">'+
   S.doctors.map((d,i)=>'<div><span style="flex:1">'+esc(d.zh)+'</span><code>'+esc(d.en)+'</code><button class="btn ghost" data-deldoc="'+i+'">移除</button></div>').join("")+
   '</div><div class="two"><input id="dz" placeholder="中文姓名" class="search" style="margin:0"><input id="de" placeholder="英文姓，如 Lin" class="search" style="margin:0"></div><div class="actions" style="margin-top:10px"><button class="btn" id="addDoc">新增醫師</button></div></div>'+
  '<div class="card"><h2>這台裝置的資料</h2><p>共 '+S.records.length+' 位病人，約 '+size+' KB。資料只存在這台裝置的瀏覽器中；清除瀏覽器資料會一併刪除，請定期備份。</p></div>';
  $("#expNew").onclick=()=>doExport(true);$("#expAll").onclick=()=>doExport(false);
  $("#impFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>mergeImport(rd.result);rd.readAsText(f);e.target.value=""};
  $("#addDoc").onclick=()=>{const zh=$("#dz").value.trim(),en=$("#de").value.trim().replace(/[^A-Za-z]/g,"");
    if(!zh||!en){toast("請填中文姓名與英文姓（僅限英文字母）");return}
    S.doctors.push({zh,en:en[0].toUpperCase()+en.slice(1).toLowerCase()});persist();renderSettings()};
  $("#setBody").querySelectorAll("[data-deldoc]").forEach(b=>b.onclick=()=>{const d=S.doctors[+b.dataset.deldoc];if(confirm("從名單移除 "+d.zh+"？已建立的病人檔案不受影響。")){S.doctors.splice(+b.dataset.deldoc,1);persist();renderSettings()}});
}
